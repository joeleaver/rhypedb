[package]
name = "rhypedb-embed"
version.workspace = true
edition.workspace = true

# ONNX linking strategy is feature-gated so the same source builds two ways:
#   onnx-download (default) — fastembed downloads + statically links ONNX Runtime
#     at build time (needs network during `cargo build`). Matches prior behavior.
#   onnx-static            — no build-time download; ort statically links a
#     user-provided libonnxruntime.a found via ORT_LIB_LOCATION (set at build
#     time). Builds fully offline AND yields a self-contained binary (ONNX baked
#     in, no runtime .so). This is what the nlnwt buildpack uses.
#   onnx-dynamic           — no build-time download/link; ONNX is dlopen'd at
#     runtime (point ORT_DYLIB_PATH at a libonnxruntime.so). Also builds offline.
# Exactly one should be active. `hf-hub-native-tls` + `image-models` are the rest
# of fastembed's former defaults, re-added in every arm.
[features]
default = ["onnx-download"]
onnx-download = [
    "fastembed/ort-download-binaries-native-tls",
    "fastembed/hf-hub-native-tls",
    "fastembed/image-models",
]
# No ort linking feature: ort-sys static-links the lib at ORT_LIB_LOCATION
# (ort-sys build/main.rs SYSTEM_LIB_PATH path, not gated on download-binaries).
onnx-static = [
    "fastembed/hf-hub-native-tls",
    "fastembed/image-models",
]
onnx-dynamic = [
    "fastembed/ort-load-dynamic",
    "fastembed/hf-hub-native-tls",
    "fastembed/image-models",
]

[dependencies]
fastembed = { workspace = true }
thiserror = { workspace = true }
# Used to fetch the default int8 reranker (Xenova/bge-reranker-base) on first
# use. Features matched to fastembed's hf-hub usage (sync ureq + native-tls).
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "native-tls"] }
