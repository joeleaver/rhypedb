[package]
name = "rhypedb-embed"
version.workspace = true
edition.workspace = true

[dependencies]
fastembed = { workspace = true }
thiserror = { workspace = true }
# Used to fetch the default int8 reranker (Xenova/bge-reranker-base) on first
# use. Features matched to fastembed's hf-hub usage (sync ureq + native-tls).
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "native-tls"] }
