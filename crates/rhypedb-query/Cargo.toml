[package]
name = "rhypedb-query"
version.workspace = true
edition.workspace = true
description = "Query language and execution layer for rhypedb."
license.workspace = true
repository.workspace = true
homepage.workspace = true

# Forward the ONNX linking choice through to rhypedb-engine → rhypedb-embed.
# default-features=false so this path doesn't pin onnx-download (feature unification).
# The fastembed/ONNX stack is optional: build with `--no-default-features` to get
# a query layer with no ONNX dependency (each onnx-* arm implies `fastembed`).
[features]
default = ["onnx-download"]
# Forward the fastembed backend through to rhypedb-engine.
fastembed = ["rhypedb-engine/fastembed"]
onnx-download = ["fastembed", "rhypedb-engine/onnx-download"]
onnx-static = ["fastembed", "rhypedb-engine/onnx-static"]
onnx-dynamic = ["fastembed", "rhypedb-engine/onnx-dynamic"]

[dependencies]
bytes = { workspace = true }
rhypedb-schema = { workspace = true }
rhypedb-engine = { workspace = true }
rhypedb-authz = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rhypedb-storage = { workspace = true }
tempfile = { workspace = true }
bytes = { workspace = true }
# test-support exposes Principal::new_authenticated so the authz gate tests can build
# authenticated principals directly. Only affects the test build (dev-deps never reach the
# library or downstream consumers), so the production surface stays principal-from-token-only.
rhypedb-authz = { workspace = true, features = ["test-support"] }
