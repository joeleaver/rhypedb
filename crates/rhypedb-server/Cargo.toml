[package]
name = "rhypedb-server"
version.workspace = true
edition.workspace = true
description = "Network server for rhypedb: the binary TCP protocol plus an HTTP API."
license.workspace = true
repository.workspace = true
homepage.workspace = true

# The fastembed/ONNX stack is OPTIONAL (see rhypedb-embed). With `fastembed` off,
# the server builds with NO ONNX dependency: the built-in embedder is absent, so
# the offline `reembed` import refuses an import that has @vectorize fields with a
# clear error (and is a no-op for a vector-free dump), while the live engine paths
# fall back as described in rhypedb-engine. A server with no @vectorize workloads
# builds with `--no-default-features` and pulls in NO ONNX Runtime.
#
# ONNX linking strategy, forwarded to every path that reaches rhypedb-embed
# (direct, via engine, and via query). Each onnx-* arm also turns on this crate's
# own `fastembed` feature (which the import-path cfg-gating keys off).
# default-features=false on those deps (workspace level) so a consumer building
# with `--no-default-features --features onnx-dynamic` (e.g. the nlnwt buildpack,
# which embeds this crate as a lib) gets a pure offline build with no path
# re-enabling the build-time download.
[features]
default = ["onnx-download"]
# Compile the fastembed-backed reembed import path; forwards the backend through
# the whole stack. Does NOT by itself select an ONNX linking strategy — use one
# of the onnx-* arms (which each imply this).
fastembed = [
    "rhypedb-embed/fastembed",
    "rhypedb-engine/fastembed",
    "rhypedb-query/fastembed",
]
onnx-download = [
    "fastembed",
    "rhypedb-embed/onnx-download",
    "rhypedb-engine/onnx-download",
    "rhypedb-query/onnx-download",
]
onnx-static = [
    "fastembed",
    "rhypedb-embed/onnx-static",
    "rhypedb-engine/onnx-static",
    "rhypedb-query/onnx-static",
]
onnx-dynamic = [
    "fastembed",
    "rhypedb-embed/onnx-dynamic",
    "rhypedb-engine/onnx-dynamic",
    "rhypedb-query/onnx-dynamic",
]

[dependencies]
mimalloc = { version = "0.1", default-features = false }
# For mi_option_set, to tune the purge delay in-process (see main.rs).
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
rhypedb-storage = { workspace = true }
rhypedb-schema = { workspace = true }
rhypedb-engine = { workspace = true }
rhypedb-query = { workspace = true }
rhypedb-authz = { workspace = true }
rhypedb-embed = { workspace = true }
rhypedb-vector = { workspace = true }
rhypedb-subscribe = { workspace = true }
rhypedb-wire = { workspace = true, features = ["tokio"] }
bytes = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
# Streaming `/admin/backup/stream` tar archive.
tar = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
ureq = { workspace = true }
# The official client (sync + the `async` AsyncClient) + codegen, exercised
# against a real in-process server in the client_e2e test module (the
# increment-5/6 acceptance tests). Dev-only, so the client/codegen stay out of
# the server's runtime dependency set.
rhypedb-client = { workspace = true, features = ["async"] }
rhypedb-codegen = { workspace = true }
# test-support exposes the in-test JWT signer so the authz tests can mint tokens.
rhypedb-authz = { workspace = true, features = ["test-support"] }
