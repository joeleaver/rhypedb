[package]
name = "rhypedb-engine"
version.workspace = true
edition.workspace = true
description = "Core database engine for rhypedb: schema, objects, relations, transactions, secondary indexes, and vector search."
license.workspace = true
repository.workspace = true
homepage.workspace = true

# The fastembed/ONNX stack is OPTIONAL (see rhypedb-embed). With `fastembed` off,
# the engine builds with no ONNX dependency; the built-in FastEmbedder/FastReranker
# are absent, so the vectorize worker and `search_text` return a clear error /
# fall back to raw HNSW results. A consumer with no @vectorize fields builds with
# `--no-default-features` and pulls in NO ONNX Runtime.
#
# Each onnx-* arm forwards the ONNX linking choice to rhypedb-embed AND turns on
# this crate's own `fastembed` feature (which the cfg-gating keys off). The embed
# dep is default-features=false at the workspace level so this path doesn't force
# `onnx-download` back on when a consumer selects onnx-dynamic (Cargo unifies
# features across all paths to embed).
[features]
default = ["onnx-download"]
# Compile the fastembed-backed embedder/reranker call sites; forwards to embed.
fastembed = ["rhypedb-embed/fastembed"]
onnx-download = ["fastembed", "rhypedb-embed/onnx-download"]
onnx-static = ["fastembed", "rhypedb-embed/onnx-static"]
onnx-dynamic = ["fastembed", "rhypedb-embed/onnx-dynamic"]
# Crash-recovery fuzz harness support: forwards to the storage injector so the
# vectorize/HNSW fault sites become live and `catch_crash`/`arm` are available.
# OFF by default — a shipped engine build is byte-identical to one that never
# named this feature (`crash_inject::hit` monomorphizes to nothing).
crash-fuzz = ["rhypedb-storage/crash-fuzz"]

[dependencies]
rhypedb-storage = { workspace = true }
rhypedb-schema = { workspace = true }
rhypedb-vector = { workspace = true }
rhypedb-embed = { workspace = true }
rhypedb-subscribe = { workspace = true }
rhypedb-wire = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
