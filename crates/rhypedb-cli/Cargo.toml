[package]
name = "rhypedb-cli"
version.workspace = true
edition.workspace = true
description = "Command-line tools for rhypedb: typed-client code generation and admin utilities."
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
clap = { workspace = true, features = ["env"] }
serde = { workspace = true }
serde_json = { workspace = true }
rustyline = { workspace = true }
ureq = { workspace = true }
# Typed-client codegen (`codegen` subcommand). These are lightweight pure-Rust
# crates (schema parser + code emitter) — NOT the engine, so the CLI stays
# engine-free.
rhypedb-schema = { workspace = true }
rhypedb-codegen = { workspace = true }
# Unpack a streamed `/admin/backup/stream` tar (download/restore/verify).
tar = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
