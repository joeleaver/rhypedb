[package]
name = "rhypedb-storage"
version.workspace = true
edition.workspace = true

[dependencies]
ahash = "0.8"
bytes = { workspace = true }
crc32fast = { workspace = true }
crossbeam-skiplist = { workspace = true }
# Pure-Rust LZ4 for per-block SST compression (v6). Block API only —
# `default-features = false` drops the `frame` feature (and its twox-hash dep);
# `safe-encode`/`safe-decode` keep it free of internal `unsafe`.
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
memmap2 = "0.9"
parking_lot = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Advisory `flock(2)` on the data dir (layer 1 of the single-writer guard).
# Target-gated: the lock engages only on unix; other platforms fall through to
# the owner-fence (layer 2), which makes a double-open detectable regardless.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
