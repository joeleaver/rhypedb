# Postgres service for Suite 1. The data volume is mounted into a host directory
# under the benchmarks tree so it can be torn down with `docker compose down -v`
# (or by removing the volume) between runs without losing the init scripts.
#
# Port 5433 (not 5432) keeps this clear of any system Postgres that may be on
# the default port. Connection string for the harness:
#
#     postgresql://bench:bench@127.0.0.1:5433/bench
#
# fsync=off + synchronous_commit=off + full_page_writes=off make this fast and
# unsafe — exactly what we want for repeatable benchmarks against a fresh DB.
# Do not use these settings for anything you care about.

services:
  postgres:
    # pgvector/pgvector:pg16 is stock Postgres 16 plus the `vector` extension,
    # so Suite 1 (relational) still runs unchanged and Suite 2 (vector) can
    # `CREATE EXTENSION vector`. Swapped from postgres:16-alpine for Suite 2.
    image: pgvector/pgvector:pg16
    container_name: rhypedb-bench-postgres
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      - "127.0.0.1:5433:5432"
    # pgvector's PARALLEL HNSW build shares the graph via a DSM segment sized
    # ~maintenance_work_mem; the Docker default /dev/shm (64MB) is far too small
    # and the build fails with DiskFull. Give it headroom (> maintenance_work_mem).
    shm_size: "4gb"
    volumes:
      - ./schemas/bench1.sql:/docker-entrypoint-initdb.d/01-bench1.sql:ro
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 1s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
