[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rhypedb-storage = { path = "crates/rhypedb-storage" }
rhypedb-schema = { path = "crates/rhypedb-schema" }
rhypedb-engine = { path = "crates/rhypedb-engine" }
rhypedb-vector = { path = "crates/rhypedb-vector" }
rhypedb-query = { path = "crates/rhypedb-query" }
rhypedb-embed = { path = "crates/rhypedb-embed" }
bytes = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rustyline = "15"
ureq = { version = "3", features = ["json"] }
crc32fast = "1"
fastembed = "5"
crossbeam-skiplist = "0.1"
parking_lot = "0.12"
rand = "0.9"
thiserror = "2"
tempfile = "3"
