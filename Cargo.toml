[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joeleaver/rhypedb"
homepage = "https://joeleaver.github.io/rhypedb"

[workspace.dependencies]
# Internal deps carry both `path` (used for local workspace builds) and `version`
# (used by the published crate on crates.io). Keep `version` in lockstep with
# `[workspace.package].version`.
rhypedb-storage = { path = "crates/rhypedb-storage", version = "0.1.0" }
rhypedb-schema = { path = "crates/rhypedb-schema", version = "0.1.0" }
rhypedb-codegen = { path = "crates/rhypedb-codegen", version = "0.1.0" }
# default-features off on the crates that sit on a path to rhypedb-embed, so the
# ONNX linking choice (onnx-download / onnx-dynamic) flows from the top binary and
# no path silently re-enables the build-time download via feature unification.
# Each of these crates re-adds `default = ["onnx-download"]` for standalone builds.
rhypedb-engine = { path = "crates/rhypedb-engine", version = "0.1.0", default-features = false }
rhypedb-vector = { path = "crates/rhypedb-vector", version = "0.1.0" }
rhypedb-query = { path = "crates/rhypedb-query", version = "0.1.0", default-features = false }
rhypedb-embed = { path = "crates/rhypedb-embed", version = "0.1.0", default-features = false }
rhypedb-subscribe = { path = "crates/rhypedb-subscribe", version = "0.1.0" }
rhypedb-wire = { path = "crates/rhypedb-wire", version = "0.1.0" }
rhypedb-client = { path = "crates/rhypedb-client", version = "0.1.0" }
base64 = "0.22"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1" }
axum = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
rustyline = "15"
ureq = { version = "3", features = ["json"] }
crc32fast = "1"
# default-features off so consumers pick the ONNX linking strategy via the
# onnx-download / onnx-dynamic features on rhypedb-embed (see that crate).
fastembed = { version = "5", default-features = false }
crossbeam-skiplist = "0.1"
parking_lot = "0.12"
boxcar = "0.2"
arc-swap = "1"
rand = "0.9"
thiserror = "2"
tempfile = "3"
sha2 = "0.10"
